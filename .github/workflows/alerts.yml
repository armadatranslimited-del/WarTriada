name: Оновлення тривог

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alerts
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Завантажити стан тривог
        run: |
          curl -fsSL --max-time 30 --retry 3 "https://ubilling.net.ua/aerialalerts/" -o new.json
          # перевірка, що це коректний JSON зі списком областей
          jq -e '.states | length > 10' new.json > /dev/null
          jq -c . new.json > alerts.json
          rm new.json

      - name: Зберегти, якщо щось змінилось
        run: |
          git config user.name "alerts-bot"
          git config user.email "alerts-bot@users.noreply.github.com"
          git add alerts.json
          if git diff --cached --quiet; then
            echo "Без змін"
          else
            git commit -m "Оновлення тривог"
            git push
          fi
